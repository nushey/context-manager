name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet pack src/ContextManager.Mcp/ContextManager.Mcp.csproj -c Release -o nupkgs

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "nupkgs/ContextManager.${GITHUB_REF_NAME#v}.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  mcp-registry:
    needs: nuget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Wait for NuGet.org to serve the package README
        run: |
          url="https://api.nuget.org/v3-flatcontainer/contextmanager/${GITHUB_REF_NAME#v}/readme"
          for attempt in $(seq 0 12); do
            curl -sfo /dev/null "$url" && exit 0
            [ "$attempt" -lt 12 ] && sleep 300
          done
          echo "::error::NuGet.org did not serve ${url} within 1 hour"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - run: ./mcp-publisher login github-oidc

      - run: ./mcp-publisher publish
